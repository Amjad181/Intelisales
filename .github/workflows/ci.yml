name: IntelliSales CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Back-End/package-lock.json

      - name: Install backend dependencies
        working-directory: Back-End
        run: npm ci

      - name: Run backend tests
        working-directory: Back-End
        run: npm test


  mobile:
    name: Flutter Mobile CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Flutter dependencies
        working-directory: Front-End-MobileApplication
        run: flutter pub get

      - name: Analyze Flutter code
        working-directory: Front-End-MobileApplication
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: Front-End-MobileApplication
        run: flutter test


  web:
    name: Web Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check web files
        working-directory: Front-End-Web
        run: |
          test -f index.html
          test -f dashboard.html
          echo "Web frontend files exist"
